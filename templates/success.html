{% extends "base.html" %}
{% block title %}Check-in Complete{% endblock %}
{% block content %}
<style>
/* Scoped styles: only the two completion screens are affected. */
.fns-finish-card { animation: fns-finish-arrive 650ms cubic-bezier(.2,.8,.2,1) both; }
.fns-finish-icon { position: relative; isolation: isolate; animation: fns-finish-pop 560ms cubic-bezier(.16,1.35,.4,1) 180ms both; }
.fns-finish-icon::before { content: ""; position: absolute; inset: -7px; border: 1px solid #8ce6c2; border-radius: 50%; z-index: -1; animation: fns-finish-ring 950ms ease-out 330ms both; }
.fns-finish-check { width: 37px; height: 37px; overflow: visible; }
.fns-finish-check path { fill: none; stroke: #047857; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 44; stroke-dashoffset: 44; animation: fns-finish-draw 530ms cubic-bezier(.4,0,.2,1) 560ms forwards; }
.fns-finish-content { animation: fns-finish-content 550ms ease-out 350ms both; }
@keyframes fns-finish-arrive { from { opacity: 0; transform: translateY(19px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fns-finish-pop { from { opacity: 0; transform: scale(.74); } to { opacity: 1; transform: scale(1); } }
@keyframes fns-finish-ring { 0% { opacity: .8; transform: scale(.78); } 75% { opacity: .34; } 100% { opacity: 0; transform: scale(1.35); } }
@keyframes fns-finish-draw { to { stroke-dashoffset: 0; } }
@keyframes fns-finish-content { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .fns-finish-card, .fns-finish-icon, .fns-finish-icon::before, .fns-finish-content, .fns-finish-check path { animation: none !important; } .fns-finish-check path { stroke-dashoffset: 0; } }
</style>
<section class="fns-finish-card mx-auto mt-12 max-w-xl rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-lg">
  <div class="fns-finish-icon mx-auto grid size-16 place-items-center rounded-full bg-emerald-100 text-emerald-700" aria-hidden="true">
    <svg class="fns-finish-check" viewBox="0 0 48 48" focusable="false"><path d="M10 25 L20 34 L39 14" /></svg>
  </div>
  <div class="fns-finish-content">
    <h1 class="mt-5 text-3xl font-extrabold text-slate-900">Check-in Complete</h1>
    <p class="mt-3 text-sm leading-relaxed text-slate-600"><strong>{{ visitor_name }}</strong>, your registration has been recorded.</p>
    <div class="my-6 rounded-xl border border-slate-100 bg-slate-50 px-4 py-3 font-semibold text-slate-700">{{ check_in }}</div>
    <a class="inline-flex rounded-xl bg-[#003A70] px-5 py-3 text-sm font-bold text-white hover:bg-[#002B5C]" href="{{ url_for('register') }}">Register Another Visitor</a>
  </div>
</section>
<script>
  // Preserve the original 10-second automatic return.
  setTimeout(() => { window.location.href = {{ url_for('register')|tojson }}; }, 10000);
</script>
{% endblock %}
