{% extends "base.html" %}
{% block title %}Check-out Complete{% endblock %}
{% block content %}
<style>
  /* Only affects the check-out completion screen. */
  .visit-done { animation: visit-card-in .65s cubic-bezier(.22,1,.36,1) both; }
  .visit-done__icon { position: relative; display: grid; place-items: center; width: 76px; height: 76px; margin: 0 auto; border-radius: 50%; background: #dcfce7; color: #087f5b; animation: visit-icon-in .62s .13s cubic-bezier(.2,1.4,.4,1) both; }
  .visit-done__icon::after { content: ""; position: absolute; inset: -8px; border: 1px solid #b6e8cd; border-radius: 50%; animation: visit-ring 1s .2s ease-out both; }
  .visit-done__check { width: 39px; height: 39px; fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .visit-done__check path { stroke-dasharray: 52; stroke-dashoffset: 52; animation: visit-check-draw .55s .51s ease-out forwards; }
  .visit-done__body { animation: visit-body-in .6s .4s ease-out both; }
  @keyframes visit-card-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes visit-icon-in { from { opacity: 0; transform: scale(.68); } to { opacity: 1; transform: scale(1); } }
  @keyframes visit-ring { from { opacity: .65; transform: scale(.7); } to { opacity: 0; transform: scale(1.3); } }
  @keyframes visit-check-draw { to { stroke-dashoffset: 0; } }
  @keyframes visit-body-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .visit-done, .visit-done__icon, .visit-done__icon::after, .visit-done__body, .visit-done__check path { animation: none !important; }
    .visit-done__check path { stroke-dashoffset: 0; }
  }
</style>
<section class="visit-done mx-auto mt-12 max-w-xl rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-lg">
  <div class="visit-done__icon" aria-hidden="true">
    <svg class="visit-done__check" viewBox="0 0 48 48"><path d="M11 25l9 9 18-20"/></svg>
  </div>
  <div class="visit-done__body">
    <h1 class="mt-6 text-3xl font-extrabold text-slate-900">Check-out Complete</h1>
    <p class="mt-3 text-sm leading-relaxed text-slate-600"><strong>{{ visitor_name }}</strong> from <strong>{{ company }}</strong><br>Your check-out has been recorded.</p>
    <div class="my-6 rounded-xl border border-slate-100 bg-slate-50 px-4 py-3 font-semibold text-slate-700">{{ check_out }}</div>
    <a class="inline-flex rounded-xl bg-[#003A70] px-5 py-3 text-sm font-bold text-white hover:bg-[#002B5C]" href="{{ url_for('register') }}">Return to Home</a>
  </div>
</section>
<script>
  window.setTimeout(() => { window.location.href = {{ url_for('register')|tojson }}; }, 10000);
</script>
{% endblock %}
