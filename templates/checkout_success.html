{% extends "base.html" %}
{% block title %}Check-out Complete{% endblock %}
{% block content %}<section class="mx-auto mt-12 max-w-xl rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-lg"><div class="mx-auto grid size-16 place-items-center rounded-full bg-emerald-100 text-3xl font-black text-emerald-700">✓</div><h1 class="mt-5 text-3xl font-extrabold text-slate-900">Check-out Complete</h1><p class="mt-3 text-sm leading-relaxed text-slate-600"><strong>{{ visitor_name }}</strong> from <strong>{{ company }}</strong><br>Your check-out has been recorded.</p><div class="my-6 rounded-xl border border-slate-100 bg-slate-50 px-4 py-3 font-semibold text-slate-700">{{ check_out }}</div><a class="inline-flex rounded-xl bg-[#003A70] px-5 py-3 text-sm font-bold text-white hover:bg-[#002B5C]" href="{{ url_for('register') }}">Return to Home</a></section>
<script>setTimeout(() => { window.location.href = {{ url_for('register')|tojson }}; }, 10000);</script>{% endblock %}
